name: Build and Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install MinGW
        shell: powershell
        run: |
          choco install mingw -y
          refreshenv

      - name: Compile EXE
        shell: cmd
        run: g++ main.cpp -mwindows -static -o rectangle.exe

      - name: Create Release and Upload EXE
        uses: ncipollo/release-action@v1
        with:
          tag: v0.1
          name: rectangle.exe
          path: rectangle.exe
          generateReleaseNotes: false
