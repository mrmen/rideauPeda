name: Build static SDL2 exe

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        install: >
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-SDL2

    - name: Build static exe
      shell: msys2 {0}
      run: |
        gcc main.c -o rectangle.exe \
          -static \
          -lmingw32 -lSDL2main -lSDL2 \
          -mwindows

    - name: Upload exe
      uses: actions/upload-artifact@v4
      with:
        name: rectangle-static-exe
        path: rectangle.exe
