name: Build Windows EXE
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v1
      - name: Build EXE
        run: cl main.cpp user32.lib gdi32.lib
      - name: Upload EXE
        uses: actions/upload-artifact@v3
        with:
          name: rectangle
          path: main.exe
