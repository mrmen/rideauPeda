name: Build Windows EXE

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install MinGW
        shell: powershell
        run: |
          choco install mingw -y
          refreshenv

      - name: Compile EXE with MinGW
        shell: cmd
        run: |
          g++ main.cpp -mwindows -static -o rectangle.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: rectangle
          path: rectangle.exe
